name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pion:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Tap this checkout
        run: brew tap pavelhorak/tap "$GITHUB_WORKSPACE"

      - run: brew style pavelhorak/tap/pion
      - run: brew install pavelhorak/tap/pion
      - run: brew test pavelhorak/tap/pion

      - name: The service starts and answers on 1974
        run: |
          brew services start pion
          for i in $(seq 1 40); do
            if python3 -c "import socket;s=socket.create_connection(('127.0.0.1',1974),timeout=1);s.sendall(b'*1\r\n\$4\r\nPING\r\n');assert s.recv(16)==b'+PONG\r\n'" 2>/dev/null; then
              echo "PONG after ${i}s"; brew services stop pion; exit 0
            fi
            sleep 1
          done
          echo "::error::the service never answered"
          cat "$(brew --prefix)/var/log/pion.log" || true
          exit 1
